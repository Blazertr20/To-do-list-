<!DOCTYPE html >
<html>
<head>
<title> Quiz website :3 </title>
<link rel="stylesheet" href="quizziz.css">

</head>
<body>


 <div class="frills">
         <div class="sprite-container" id="sprite-container">

        <div class="sprite testmaking-sprite pixelart"></div>
        
        <div class="sprite testaking-sprite pixelart"></div>
    </div>
    
    <div id="quiz-creator">
    <h2>Create your own quiz</h2>

    <input type="text" id="quiz-title-input" placeholder="Name your quiz (e.g history reviwew etc)" maxlength="30">

    <input type="text" id="new-question" name="new-question" placeholder="Enter your question">

    <div class="answers-input">
        <input type="text" class="answer-input" name="answer1" placeholder="Answer 1">
        <input type="text" class="answer-input" name="answer2" placeholder="Answer 2">
        <input type="text" class="answer-input" name="answer3" placeholder="Answer 3">
        <input type="text" class="answer-input" name="answer4" placeholder="Answer 4">

    </div>

    <label for="correct-answer">Which answer is correct?</label>

    <select id="correct-answer"> 
        <option value="0">Answer 1</option>
        <option value="1">Answer 2</option>
        <option value="2">Answer 3</option>
        <option value="3">Answer 4</option>
      
    </select>

    <button id="add-question-btn">Add your question</button>
    <button id="start-custom-quiz-btn">Start My Quiz</button>
    <button id="save-quiz-btn">Save This Quiz</button>

    <ul id="question-list"></ul>

    <div id="saved-quizzes-section">
        <h3> Your saved quizzes</h3>
        <ul id="saved-quizzes-list"></ul>
    </div>
   </div>

   <div id="quiz-container" style="display:none;">

        <div class="app">
        <h1>Simple Quiz</h1>
         <div class="quiz">

            <div id="timer-display">Time: 0s</div>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
            <h2 id="question">Add questions here</h2>
            <div id="results-container">
                <div class="results-header">
                    <h2 id="results score"></h2>
                    <p class="results-sub" id="results-sub"></p>
                </div>
                <div class ="results list" id="results-list"></div>
            </div>
            <div id="answer-buttons"></div>
            <button id="next-btn">Next</button>
                </div>
    </div>
   </div>
  
    <script src="quiz.js"></script>
    
   </div>
    
<a href="todo.html" class="home-btn"> Home </a>

</body>

</html>
