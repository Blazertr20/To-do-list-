
<!---Pomodoro timer -->
<!DOCTYPE html>
<html lang="en">
    <head>
<meta charset=" UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title> Pomodoro Timer</title>
<link rel="stylesheet" href="Timer.css">
<script src="timer.js" defer> </script>

 </head>
<body>

    <div class="main-wrapper">

    <div class="spider-container">
            <img id="spider" class="spider-spritesheet pixelart" src="imole-shock.png" alt="spider">

         </div>


     <div class="harles">
        
        
        <div class="container">
        <h1 class="title"> Pomodoro Timer </h1>

        <div class="modes">
            <button class="mode-btn active" id="focus-mode"> Focus(25m) </button>
            <button class="mode-btn" id="break-mode">Short Break (5m) </button>
            </div>


   <hr>

    <p class="timer" id="timer"> 25:00 </p>
  

    <div class="timer-btn">
        <button id="start" >Start  </button>
        <button id="stop"> Pause </button>
        <button id="reset" >Reset </button>
   
     </div>
  
   
    

        



        </div>
   
    
    </div>
</div>

    
</body>
</html>
