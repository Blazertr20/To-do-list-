<html lang="en">

 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="todo.js" defer></script>

 <body class="todo-page">
     <div class="todo-app">
    <div class="container">
       
            <h1>
                To-Do list

        </div>

<p class="pomodoro-link"> Pomodoro timer: <a href="pomodoro.html"> Open Pomodoro Timer</a> </p>
